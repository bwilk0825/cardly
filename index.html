<!DOCTYPE html>
<html lang="en" data-theme="light" data-font="m">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cardly — Study smarter</title>
<meta name="description" content="Flashcards, practice tests, match games, arcade mode and live multiplayer quizzes.">
<meta name="theme-color" content="#4255ff">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --accent:#4255ff;--accent-2:#7c89ff;--ring:rgba(66,85,255,.22);
  --bg:#f4f6fb;--glass:rgba(246,248,252,.85);--card:#ffffff;--card-2:#f1f3fa;--hover:#eceff9;
  --text:#1c2140;--muted:#67709a;--border:#e3e7f4;
  --green:#22c55e;--red:#ef4453;--gold:#f5b301;--navy:#282e3e;
  --sh:0 1px 2px rgba(23,28,63,.05),0 10px 30px -14px rgba(23,28,63,.20);
  --sh-lg:0 24px 70px -20px rgba(23,28,63,.38);
  --r:16px;--r-s:10px;
}
html[data-theme=dark]{
  --bg:#0d101f;--glass:rgba(14,17,32,.84);--card:#171c33;--card-2:#202748;--hover:#252c50;
  --text:#eef1ff;--muted:#939cc9;--border:#2a3256;
  --sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.5);
  --sh-lg:0 24px 70px -18px rgba(0,0,0,.7);
  --ring:rgba(124,137,255,.28);
}
html[data-font=s]{font-size:13.5px}
html[data-font=m]{font-size:15px}
html[data-font=l]{font-size:16.5px}
html,body{height:100%}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 420px at 85% -8%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 70%)}
body.locked{overflow:hidden}
::selection{background:color-mix(in srgb,var(--accent) 25%,transparent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
button{font-family:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--ring);border-radius:6px}

/* ---------- topbar ---------- */
.topbar{position:sticky;top:0;z-index:60;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  background:var(--glass);border-bottom:1px solid var(--border)}
.tb-inner{display:flex;align-items:center;gap:9px;padding:10px 20px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.25rem;cursor:pointer;color:var(--text);text-decoration:none;letter-spacing:-.02em}
.logo b{color:var(--accent)}
.tb-sp{flex:1}
.avatar{width:38px;height:38px;border-radius:50%;overflow:hidden;border:2px solid var(--border);cursor:pointer;background:var(--card-2);display:grid;place-items:center;padding:0;font-size:1.1rem}
.avatar img{width:100%;height:100%;object-fit:cover}

/* ---------- buttons / inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;font-size:.95rem;
  color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 16px;
  cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s,color .15s,filter .15s;user-select:none;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff;box-shadow:0 8px 22px -8px var(--ring)}
.btn.primary:hover{filter:brightness(1.09);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent);background:transparent}
.btn.danger:hover{background:var(--red);color:#fff;border-color:var(--red)}
.btn.icon{padding:9px;border-radius:11px}
.btn.sm{padding:6px 11px;font-size:.84rem;border-radius:9px}
.btn.lg{padding:14px 22px;font-size:1.05rem;border-radius:14px}
.btn.white{background:#fff;color:var(--accent);border-color:#fff}
.btn.white:hover{color:var(--accent);filter:brightness(.94)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.wfull{width:100%}
.inp,.ta,.sel{font:inherit;color:var(--text);background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:10px 14px;width:100%;transition:border-color .15s,box-shadow .15s}
.inp:focus,.ta:focus,.sel:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--ring)}
.ta{resize:vertical;min-height:90px}
.sel{width:auto;cursor:pointer}
.lbl{display:block;font-weight:700;font-size:.85rem;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.field{margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 70px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card-2);color:var(--muted);border-radius:999px;padding:5px 12px;font-size:.82rem;font-weight:700}
.chip.acc{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:22px}
.center{text-align:center}
.muted{color:var(--muted)}
.mt{margin-top:14px}
.seg{display:inline-flex;background:var(--card-2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer;color:var(--muted);transition:.15s}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--sh)}
.sw{position:relative;display:inline-block;width:44px;height:26px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:var(--border);border-radius:999px;transition:.2s;cursor:pointer}
.sw i:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i:before{transform:translateX(18px)}
.progress{height:8px;background:var(--card-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px;transition:width .35s}
.kbd{display:inline-block;min-width:26px;padding:3px 8px;border:1px solid var(--border);border-bottom-width:3px;border-radius:7px;background:var(--card-2);font-weight:700;font-size:.78rem;text-align:center;color:var(--muted)}
.dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid transparent;display:inline-block}
.dot.on{border-color:var(--text)}
.hr{border:0;border-top:1px solid var(--border);margin:16px 0}

/* ---------- home ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:28px;display:flex;justify-content:space-between;align-items:center;gap:18px;
  background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#fff;box-shadow:var(--sh)}
.hero:before{content:"";position:absolute;width:340px;height:340px;border-radius:50%;background:rgba(255,255,255,.12);top:-160px;right:-80px}
.hero:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.09);bottom:-130px;right:180px}
.hero h1{font-size:1.7rem;font-weight:900;letter-spacing:-.02em}
.hero p{opacity:.92;margin-top:4px}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.streak{position:absolute;top:14px;right:16px;background:rgba(255,255,255,.2);backdrop-filter:blur(4px);padding:6px 13px;border-radius:999px;font-weight:800;font-size:.85rem}
.toolbar{display:flex;gap:10px;align-items:center;margin:20px 0 14px;flex-wrap:wrap}
.toolbar .search{flex:1;min-width:180px;max-width:340px}
.grid-sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:16px}
.setcard{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--sh);
  display:flex;flex-direction:column;gap:10px;transition:transform .18s,box-shadow .18s,border-color .18s}
.setcard:hover{transform:translateY(-3px);box-shadow:var(--sh-lg);border-color:color-mix(in srgb,var(--accent) 35%,var(--border))}
.sc-top{display:flex;gap:12px;align-items:flex-start}
.sc-emoji{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:1.5rem;flex:none;
  background:color-mix(in srgb,var(--accent) 13%,transparent)}
.sc-title{font-weight:800;font-size:1.02rem;letter-spacing:-.01em;cursor:pointer;line-height:1.3}
.sc-title:hover{color:var(--accent)}
.sc-meta{font-size:.82rem;color:var(--muted);margin-top:2px}
.sc-prog{height:6px;background:var(--card-2);border-radius:99px;overflow:hidden}
.sc-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s}
.sc-actions{display:flex;gap:8px;margin-top:auto}
.menu{position:absolute;top:52px;right:12px;z-index:30;background:var(--card);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--sh-lg);padding:6px;min-width:190px;animation:pop .15s}
.mi{display:flex;gap:10px;align-items:center;width:100%;padding:9px 12px;border-radius:9px;cursor:pointer;font:inherit;font-size:.92rem;font-weight:600;color:var(--text);background:none;border:0;text-align:left}
.mi:hover{background:var(--hover)}
.mi.danger{color:var(--red)}
.empty{border:2px dashed var(--border);border-radius:var(--r);padding:54px 20px;text-align:center;color:var(--muted);background:color-mix(in srgb,var(--card) 60%,transparent)}
.empty .big{font-size:3rem;display:block;margin-bottom:10px}

/* ---------- modal / toast ---------- */
#modal-bg{position:fixed;inset:0;background:rgba(12,14,34,.55);backdrop-filter:blur(5px);display:none;place-items:center;z-index:200;padding:18px}
#modal-bg.on{display:grid}
.modal{background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:var(--sh-lg);width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:24px;animation:pop .2s}
.modal.wide{max-width:780px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.modal-head h2{font-size:1.25rem;font-weight:800;letter-spacing:-.01em}
.x{border:0;background:var(--card-2);color:var(--muted);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:1rem;flex:none}
.x:hover{background:var(--hover);color:var(--text)}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:400;align-items:center;pointer-events:none}
.toast{background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;box-shadow:var(--sh-lg);animation:pop .25s;font-weight:600;font-size:.92rem;max-width:92vw}
html[data-theme=dark] .toast{background:#323a5e}
.toast.err{background:var(--red)}
.toast.out{opacity:0;transform:translateY(8px);transition:.3s}
.shr{display:flex;gap:8px;align-items:center;margin-top:8px}
.shr .inp{flex:1;font-size:.85rem;color:var(--muted)}

/* ---------- study picker ---------- */
.study-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.study-head h2{font-size:1.35rem;font-weight:900;letter-spacing:-.02em}
.modegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.modecard{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:7px;transition:.18s;font:inherit;text-align:left;color:var(--text)}
.modecard:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--sh-lg)}
.mc-emoji{font-size:2rem}
.mc-name{font-weight:800;font-size:1.08rem}
.mc-desc{color:var(--muted);font-size:.88rem;flex:1}
.mc-stat{font-size:.8rem;font-weight:800;color:var(--accent)}
.opts-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}
.hints{margin-top:16px;color:var(--muted);font-size:.85rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- flashcards ---------- */
.fc-wrap{max-width:820px}
.fc-stage{perspective:1600px;margin:18px 0}
.fc-card{position:relative;width:100%;height:min(400px,56vh);cursor:pointer;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.7,.25,1)}
.fc-card.flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:grid;place-items:center;padding:34px;
  background:var(--card);border:1.5px solid var(--border);box-shadow:var(--sh);text-align:center}
.fc-face .fc-txt{font-size:clamp(1.25rem,3.4vw,1.9rem);font-weight:800;letter-spacing:-.01em;max-width:100%;overflow-wrap:break-word;white-space:pre-wrap}
.fc-face.back{transform:rotateY(180deg);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 10%,var(--card)),var(--card));border-color:color-mix(in srgb,var(--accent) 40%,var(--border))}
.fc-star{position:absolute;top:12px;right:12px;border:0;background:var(--card-2);width:40px;height:40px;border-radius:12px;font-size:1.15rem;cursor:pointer;color:var(--muted);z-index:2}
.fc-star.on{color:var(--gold);background:color-mix(in srgb,var(--gold) 18%,transparent)}
.fc-controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ---------- quiz / test / arcade ---------- */
.quiz-card{background:var(--card);border:1.5px solid var(--border);border-radius:20px;box-shadow:var(--sh);padding:28px;max-width:780px;margin:0 auto}
.quiz-q{font-size:clamp(1.15rem,3vw,1.5rem);font-weight:800;letter-spacing:-.01em;margin-bottom:20px;overflow-wrap:break-word;white-space:pre-wrap}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;gap:12px;align-items:center;padding:15px 16px;border:2px solid var(--border);border-radius:14px;background:var(--card);cursor:pointer;font:inherit;font-weight:600;font-size:1rem;color:var(--text);text-align:left;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.opt:disabled{cursor:default}
.opt .opt-key{width:30px;height:30px;border-radius:9px;background:var(--card-2);display:grid;place-items:center;font-weight:800;font-size:.85rem;flex:none}
.opt.ok{border-color:var(--green);background:color-mix(in srgb,var(--green) 13%,var(--card))}
.opt.ok .opt-key{background:var(--green);color:#fff}
.opt.bad{border-color:var(--red);background:color-mix(in srgb,var(--red) 13%,var(--card))}
.opt.bad .opt-key{background:var(--red);color:#fff}
.opt.dim{opacity:.4}
.timerbar{height:10px;background:var(--card-2);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.timerbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px}
.timerbar.hot i{background:linear-gradient(90deg,var(--red),#ff8a5c)}
.qfoot{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:18px;flex-wrap:wrap}
.review{border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;margin-top:10px;background:var(--card)}
.review.good{border-color:color-mix(in srgb,var(--green) 55%,var(--border))}
.review.miss{border-color:color-mix(in srgb,var(--red) 55%,var(--border))}
.tf-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ---------- match ---------- */
.match-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:11px}
.mtile{padding:16px 13px;border-radius:14px;border:2px solid var(--border);background:var(--card);font-weight:700;font-size:.95rem;cursor:pointer;text-align:center;word-break:break-word;font:inherit;color:var(--text);min-height:74px;transition:.15s}
.mtile.d{background:var(--card-2);font-weight:600}
.mtile:hover:not(.matched){border-color:var(--accent)}
.mtile.pick{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,var(--card))}
.mtile.matched{border-color:var(--green);background:color-mix(in srgb,var(--green) 16%,var(--card));opacity:.45;pointer-events:none}
.mtile.bad{animation:shake .3s;border-color:var(--red)}
.bigtime{font-size:2.6rem;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums}

/* ---------- arcade ---------- */
.arc-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:14px}
.arc-badge{display:flex;align-items:center;gap:7px;background:var(--card);border:1.5px solid var(--border);border-radius:999px;padding:7px 15px;font-weight:800}
.arc-badge.gold{color:#9a6a00;background:linear-gradient(135deg,#fff3c4,#ffe08a);border-color:#f0c94a}
html[data-theme=dark] .arc-badge.gold{color:#ffd44d;background:#3a3117;border-color:#6b5a1c}
.pu{border:2px solid var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--card));color:var(--text);border-radius:12px;padding:8px 14px;font:inherit;font-weight:800;cursor:pointer;transition:.15s}
.pu:hover:not(:disabled){transform:translateY(-1px);background:color-mix(in srgb,var(--gold) 26%,var(--card))}
.pu:disabled{opacity:.35;cursor:not-allowed}

/* ---------- live game ---------- */
.live-bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(1000px 500px at 20% -10%,#4338ca,transparent),radial-gradient(900px 600px at 110% 60%,#7c3aed,transparent),linear-gradient(135deg,#111633,#1e1b4b 55%,#312e81)}
body.playing-live .wrap{max-width:960px}
.join-code{font-size:clamp(2.4rem,9vw,4.2rem);font-weight:900;letter-spacing:.3em;text-indent:.3em;color:#fff;text-shadow:0 4px 30px rgba(124,137,255,.7)}
.live-panel{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);border-radius:20px;padding:22px;color:#fff}
.live-panel .muted{color:rgba(255,255,255,.65)}
.players-list{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.pl-chip{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 15px;font-weight:700;font-size:.92rem;animation:pop .25s}
.ans-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.ans-btn{border:0;border-radius:16px;padding:22px 18px;font:inherit;font-weight:800;font-size:clamp(1rem,2.6vw,1.25rem);color:#fff;cursor:pointer;box-shadow:0 10px 26px -10px rgba(0,0,0,.55);display:flex;align-items:center;gap:13px;text-align:left;transition:transform .12s,filter .15s;word-break:break-word}
.ans-btn:hover:not(:disabled){transform:translateY(-2px) scale(1.01);filter:brightness(1.1)}
.ans-btn:disabled{cursor:default;opacity:.55}
.ans-key{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:1.1rem;flex:none}
.a0{background:linear-gradient(135deg,#e94560,#c73553)}
.a1{background:linear-gradient(135deg,#3b82f6,#2a6fd6)}
.a2{background:linear-gradient(135deg,#f5b301,#d99c00)}
.a3{background:linear-gradient(135deg,#22c55e,#189a48)}
.a0.okay,.a1.okay,.a2.okay,.a3.okay{outline:4px solid #fff;opacity:1}
.lb{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.lb-row{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:13px;padding:10px 15px;font-weight:700;color:#fff;animation:pop .25s}
.lb-row.me{background:rgba(255,205,31,.22);border-color:#ffcd1f}
.lb-rank{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:.85rem;flex:none}
.lb-score{margin-left:auto;font-variant-numeric:tabular-nums}
.podium{display:flex;gap:14px;align-items:flex-end;justify-content:center;margin:26px 0}
.pod{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:16px;text-align:center;color:#fff;min-width:110px;animation:pop .4s}
.pod .em{font-size:2rem}
.pod.b1{padding-bottom:44px}.pod.b2{padding-bottom:26px}.pod.b3{padding-bottom:14px}

/* ---------- stats ---------- */
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:13px;margin:18px 0}
.statcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.statcard b{font-size:1.7rem;font-weight:900;letter-spacing:-.02em;display:block}
.statcard span{color:var(--muted);font-size:.83rem;font-weight:600}
.chart{width:100%;height:150px}
.sessrow{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--border);font-size:.93rem}
.sessrow:last-child{border:0}
.modebadge{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;background:var(--card-2);color:var(--muted);border-radius:7px;padding:3px 8px;flex:none}

/* ---------- editor ---------- */
.ed-head{display:flex;gap:12px;align-items:center}
.ed-emoji{width:58px;height:58px;font-size:1.7rem;border-radius:15px;border:1.5px dashed var(--border);background:var(--card);cursor:pointer;flex:none}
.ed-emoji:hover{border-color:var(--accent)}
.cardrow{display:grid;grid-template-columns:34px 1fr 1fr auto;gap:10px;align-items:center;margin-bottom:10px}
.cardrow .idx{color:var(--muted);font-weight:700;font-size:.85rem;text-align:center}
.cardrow .icol{display:flex;flex-direction:column;gap:4px}
.addrow{width:100%;border:2px dashed var(--border);background:transparent;color:var(--muted);border-radius:14px;padding:13px;font:inherit;font-weight:700;cursor:pointer;margin-top:4px}
.addrow:hover{border-color:var(--accent);color:var(--accent)}
.savebar{position:sticky;bottom:0;display:flex;gap:10px;justify-content:flex-end;padding:16px 0 6px;background:linear-gradient(transparent,var(--bg) 35%)}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emoji-grid button{border:0;background:transparent;font-size:1.35rem;padding:7px;border-radius:10px;cursor:pointer}
.emoji-grid button:hover{background:var(--hover)}

/* ---------- misc ---------- */
.ring{flex:none}
.st-table{width:100%;border-collapse:collapse;font-size:.93rem}
.st-table td{padding:9px 6px;border-bottom:1px solid var(--border)}
#app>div{animation:fade .3s}
.fade-in{animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#cfx{position:fixed;inset:0;z-index:500;pointer-events:none;display:none}
html.no-motion *,html.no-motion *::before,html.no-motion *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:760px){
  .tb-inner{padding:9px 12px}
  .wrap{padding:16px 13px 60px}
  .hero{flex-direction:column;align-items:flex-start;padding:22px}
  .opts,.tf-row,.ans-grid{grid-template-columns:1fr}
  .match-grid{grid-template-columns:repeat(auto-fill,minmax(125px,1fr))}
  .fc-card{height:min(340px,52vh)}
  .quiz-card{padding:20px}
  .cardrow{grid-template-columns:1fr 1fr;position:relative;padding-top:26px}
  .cardrow .idx{position:absolute;top:4px;left:2px}
  .cardrow .cact{position:absolute;top:0;right:0}
  .podium{flex-wrap:wrap}
}
</style>

<body>
<header class="topbar"><div class="tb-inner" id="topbar"></div></header>
<main id="app"></main>
<div id="modal-bg"></div>
<div id="toasts"></div>
<canvas id="cfx"></canvas>
<script type="module">
/* ================= Cardly 2.0 — single-file study platform ================= */
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut,sendPasswordResetEmail,updateProfile} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,doc,setDoc,getDoc,updateDoc,deleteDoc,collection,getDocs,onSnapshot,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import {getAnalytics,isSupported} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js';

const firebaseConfig = {
  apiKey: "AIzaSyD2NxZd_pjbKWxfdEGou0CEz4AXj77cITc",
  authDomain: "cardly-9bfbf.firebaseapp.com",
  projectId: "cardly-9bfbf",
  storageBucket: "cardly-9bfbf.firebasestorage.app",
  messagingSenderId: "237598072369",
  appId: "1:237598072369:web:34b06008c6cb40f44ebf10",
  measurementId: "G-3GFRQCCGTZ"
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
isSupported().then(ok=>{if(ok){try{getAnalytics(app)}catch(e){}}}).catch(()=>{});

/* ================= tiny DOM + util toolkit ================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const trunc=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const sample=(a,n)=>shuffle(a).slice(0,n);
const genCode=()=>{const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=A[Math.floor(Math.random()*A.length)];return s};
function norm(s){return (s??'').toString().toLowerCase().replace(/\(.*?\)|\[.*?\]/g,'').replace(/[^\p{L}\p{N}\s]/gu,'').replace(/\s+/g,' ').trim()}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let prev=[...Array(n+1).keys()];for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}return prev[n]}
function ansOk(input,target){const a=norm(input),b=norm(target);if(!a)return false;if(a===b)return true;
  for(const t of b.split(/[\/,;]|\bor\b/).map(x=>x.trim()).filter(Boolean)) if(a===t) return true;
  const tol=b.length>=12?2:b.length>=6?1:0;return tol&&lev(a,b)<=tol}
function spellOk(input,target){const a=norm(input),b=norm(target);if(!a)return false;if(a===b)return true;
  const tol=b.length>=16?2:b.length>=8?1:0;return tol&&lev(a,b)<=tol}
function fmtTime(ms){ms=Math.max(0,ms);if(ms<60000)return (ms/1000).toFixed(1)+'s';const m=Math.floor(ms/60000),s=Math.floor((ms%60000)/1000);return m+'m '+s+'s'}
function fmtAgo(ts){const d=Date.now()-ts;if(d<60e3)return 'just now';if(d<3600e3)return Math.floor(d/60e3)+'m ago';if(d<86400e3)return Math.floor(d/86400e3)+'h ago';if(d<604800e3)return Math.floor(d/86400e3)+'d ago';return new Date(ts).toLocaleDateString()}
function greeting(){const h=new Date().getHours();return h<5?'Late night':h<12?'Good morning':h<18?'Good afternoon':'Good evening'}
function download(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
const b64u=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
function b64uBack(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)))}
async function deflateB64(str){try{const cs=new CompressionStream('deflate-raw');const st=new Blob([str]).stream().pipeThrough(cs);const buf=await new Response(st).arrayBuffer();let bin='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=8192)bin+=String.fromCharCode(...u.subarray(i,i+8192));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}catch(e){return null}}
async function inflateB64(b){try{b=b.replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const ds=new DecompressionStream('deflate-raw');const st=new Blob([bytes]).stream().pipeThrough(ds);return await new Response(st).text()}catch(e){return null}}
function packSet(s){return JSON.stringify({v:1,t:s.title,e:s.emoji||'',c:s.cards.map(c=>[c.t,c.d])})}
function unpackSet(json){const o=JSON.parse(json);return {id:uid(),title:o.t||'Imported set',desc:'',emoji:o.e||'📥',createdAt:Date.now(),updatedAt:Date.now(),dirty:true,ownerName:S.user?S.user.displayName:'',cards:(o.c||[]).map(p=>({id:uid(),t:p[0],d:p[1],m:0,s:false}))}}

/* timers auto-cleaned on navigation */
const T={t:new Set(),
  after(ms,fn){const id=setTimeout(()=>{this.t.delete(id);fn()},ms);this.t.add(id);return id},
  every(ms,fn){const id=setInterval(fn,ms);this.t.add(id);return id},
  clearAll(){for(const id of this.t){clearTimeout(id);clearInterval(id)}this.t.clear()}};

function speak(text){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.95;speechSynthesis.speak(u)}catch(e){}}
let AC=null;
function sfx(kind){if(!S.settings.sound)return;try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  const t0=AC.currentTime;
  const tone=(f,st,dur,type='sine',vol=.14)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0,t0+st);g.gain.linearRampToValueAtTime(vol,t0+st+.012);g.gain.exponentialRampToValueAtTime(.001,t0+st+dur);
    o.connect(g);g.connect(AC.destination);o.start(t0+st);o.stop(t0+st+dur+.05)};
  const seq={
    ok:()=>{tone(660,0,.12);tone(880,.09,.18)},
    bad:()=>{tone(210,0,.22,'sawtooth',.11);tone(150,.09,.26,'sawtooth',.11)},
    click:()=>tone(520,0,.05,'square',.05),
    flip:()=>tone(340,0,.07,'sine',.07),
    coin:()=>{tone(988,0,.07,'square',.08);tone(1319,.07,.18,'square',.08)},
    win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.24)),
    pop:()=>tone(760,0,.07,'triangle',.09),
    tick:()=>tone(1100,0,.03,'square',.035)};
  (seq[kind]||seq.click)();
}catch(e){}}
function toast(msg,kind='ok'){const d=document.createElement('div');d.className='toast '+kind;d.textContent=msg;$('#toasts').appendChild(d);
  setTimeout(()=>{d.classList.add('out');setTimeout(()=>d.remove(),320)},2600)}
function confetti(n=130){const c=$('#cfx'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;c.style.display='block';
  const cols=[getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#4255ff','#ffcd1f','#22c55e','#ef4453','#8b5cf6','#38bdf8'];
  const ps=[];for(let i=0;i<n;i++)ps.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*.35,w:5+Math.random()*7,h:8+Math.random()*9,
    vx:(Math.random()-.5)*3.4,vy:2+Math.random()*4.2,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.28,col:cols[i%cols.length]});
  const t0=performance.now();
  (function frame(t){ctx.clearRect(0,0,c.width,c.height);let alive=false;
    for(const p of ps){p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.r+=p.vr;if(p.y<c.height+30)alive=true;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.col;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()}
    if(alive&&t-t0<3600)requestAnimationFrame(frame);else c.style.display='none'})(t0)}
function ring(pct,size=56){const r=(size-8)/2,cir=2*Math.PI*r,off=cir*(1-Math.min(100,pct)/100);
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--card-2)" stroke-width="6.5"/>
  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="6.5" stroke-linecap="round"
    stroke-dasharray="${cir}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/>
  <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-size="${size*.28}" font-weight="800" fill="var(--text)">${Math.round(pct)}%</text></svg>`}

/* ================= state ================= */
const DEF_SETTINGS={theme:'system',accent:'#4255ff',font:'m',motion:true,sound:true,autospeak:false,feedback:true,shortcuts:true,dir:'td',matchPairs:6,testLen:'15'};
const S={user:null,sets:[],results:[],settings:{...DEF_SETTINGS},view:'home',params:{},q:'',sort:'recent',online:navigator.onLine};
const ST={};           /* transient per-view sessions */
const VIEWS={},MOUNT={},KEYS={},ACTIONS={},A_IN={};
const ACCENTS={'#4255ff':'#7c89ff','#8b5cf6':'#b394fc','#10b981':'#4ade80','#f97316':'#fdba74','#ec4899':'#f7a1cd'};

/* ================= local persistence ================= */
function loadLocal(){try{
  S.sets=JSON.parse(localStorage.getItem('cardly.sets')||'[]');
  S.results=JSON.parse(localStorage.getItem('cardly.results')||'[]');
  S.settings={...DEF_SETTINGS,...JSON.parse(localStorage.getItem('cardly.settings')||'{}')};
}catch(e){S.sets=[];S.results=[];S.settings={...DEF_SETTINGS}}}
function persist(){try{localStorage.setItem('cardly.sets',JSON.stringify(S.sets));localStorage.setItem('cardly.results',JSON.stringify(S.results.slice(-300)))}catch(e){}}
function saveSettings(){try{localStorage.setItem('cardly.settings',JSON.stringify(S.settings))}catch(e){}}
function applySettings(){const st=S.settings,html=document.documentElement;
  const theme=st.theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):st.theme;
  html.dataset.theme=theme;html.dataset.font=st.font;
  html.classList.toggle('no-motion',!st.motion);
  html.style.setProperty('--accent',st.accent);html.style.setProperty('--accent-2',ACCENTS[st.accent]||st.accent);
  html.style.setProperty('--ring',st.accent+'38');}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.settings.theme==='system')applySettings()});

/* ================= set helpers ================= */
const byId=id=>S.sets.find(s=>s.id===id);
function newCard(t='',d=''){return {id:uid(),t,d,m:0,s:false}}
function touchSet(s){s.updatedAt=Date.now();s.dirty=true;persist();fsSaveSet(s)}
function addSet(s){S.sets.unshift(s);touchSet(s);return s}
function delSet(id){S.sets=S.sets.filter(s=>s.id!==id);S.results=S.results.filter(r=>r.setId!==id);persist();
  if(S.user&&S.online)deleteDoc(doc(db,'users',S.user.uid,'sets',id)).catch(()=>{});}
function avgM(s){if(!s.cards.length)return 0;return s.cards.reduce((a,c)=>a+(c.m||0),0)/(3*s.cards.length)}
function saveResult(r){r.id=r.id||uid();r.at=Date.now();S.results.push(r);persist();fsSaveResult(r)}
function lastResult(setId,mode){return S.results.filter(r=>r.setId===setId&&(!mode||r.mode===mode)).sort((a,b)=>b.at-a.at)[0]}
function bestMatch(setId){const m=S.results.filter(r=>r.setId===setId&&r.mode==='match').map(r=>r.score);return m.length?Math.min(...m):null}
function bestArc(setId){const m=S.results.filter(r=>r.setId===setId&&r.mode==='arcade').map(r=>r.score);return m.length?Math.max(...m):0}
function calcStreak(){const days=new Set(S.results.map(r=>new Date(r.at).toDateString()));if(!days.size)return 0;
  let d=new Date(),n=0;if(!days.has(d.toDateString()))d.setDate(d.getDate()-1);
  while(days.has(d.toDateString())){n++;d.setDate(d.getDate()-1)}return n}
function myName(){return S.user?(S.user.displayName||S.user.email.split('@')[0]):(localStorage.getItem('cardly.name')||('Guest '+Math.floor(1000+Math.random()*9000)))}

/* ================= cloud (Firestore) sync ================= */
let cloudWarned=false;
function cloudFail(){if(cloudWarned)return;cloudWarned=true;toast('Cloud sync failed — check Firestore is enabled (this device still works)','err');setTimeout(()=>cloudWarned=false,15000)}
async function fsSaveSet(s){if(!S.user||!S.online)return;try{const{id,...data}=s;await setDoc(doc(db,'users',S.user.uid,'sets',id),data);s.dirty=false}catch(e){console.warn(e);cloudFail()}}
async function fsSaveResult(r){if(!S.user||!S.online)return;try{const{id,...data}=r;await setDoc(doc(db,'users',S.user.uid,'results',id),data)}catch(e){console.warn(e)}}
async function fsDeleteResult(id){if(!S.user||!S.online)return;try{await deleteDoc(doc(db,'users',S.user.uid,'results',id))}catch(e){}}
async function syncFromFs(u){try{
  const setsSnap=await getDocs(collection(db,'users',u.uid,'sets'));
  const remote=setsSnap.docs.map(d=>({id:d.id,...d.data()}));
  const map=new Map(S.sets.map(s=>[s.id,s]));
  for(const r of remote){const l=map.get(r.id);
    if(!l||(r.updatedAt||0)>(l.updatedAt||0))map.set(r.id,{...l,...r,dirty:false});
    else if(l.dirty||((l.updatedAt||0)>(r.updatedAt||0)))fsSaveSet(l)}
  for(const s of map.values())if(s.dirty)fsSaveSet(s);
  S.sets=[...map.values()].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  const resSnap=await getDocs(collection(db,'users',u.uid,'results'));
  const rmap=new Map(S.results.map(r=>[r.id,r]));
  for(const d of resSnap.docs){const r=d.data();if(!rmap.has(r.id))rmap.set(r.id,r)}
  S.results=[...rmap.values()].sort((a,b)=>a.at-b.at).slice(-300);
  persist();
  if(S.view==='home'||S.view==='stats')go(S.view);
}catch(e){console.warn(e);cloudFail()}}

/* ================= sample content ================= */
function seedSets(){if(localStorage.getItem('cardly.seeded')||S.sets.length)return;localStorage.setItem('cardly.seeded','1');
  const mk=(title,desc,emoji,pairs)=>{const s={id:uid(),title,desc,emoji,createdAt:Date.now(),updatedAt:Date.now(),dirty:true,ownerName:'',
    cards:pairs.map(([t,d])=>({id:uid(),t,d,m:0,s:false}))};S.sets.push(s)};
  mk('Spanish Basics: Greetings','Essential everyday Spanish phrases','🇪🇸',[['Hola','Hello'],['Buenos días','Good morning'],['Buenas noches','Good night'],['Gracias','Thank you'],['Por favor','Please'],['¿Cómo estás?','How are you?'],['Mucho gusto','Nice to meet you'],['Adiós','Goodbye'],['Hasta luego','See you later'],['Lo siento',"I'm sorry"]]);
  mk('Biology: Cell Structure','Organelles and their jobs','🧬',[['Nucleus','Control center that stores DNA'],['Mitochondria','Powerhouse that produces ATP energy'],['Ribosome','Builds proteins'],['Cell membrane','Selective barrier around the cell'],['Cytoplasm','Jelly-like fluid holding the organelles'],['Chloroplast','Captures light for photosynthesis in plants'],['Cell wall','Rigid outer layer of plant cells'],['Vacuole','Stores water and nutrients'],['Lysosome','Breaks down waste and old parts'],['Endoplasmic reticulum','Transports materials around the cell']]);
  mk('Welcome to Cardly','A quick tour of everything you can do','⚡',[['How do I share a set?','Open a set, tap Share, and create a short link to send to friends'],['What is a Live game?','Host a room and friends join with the 6-letter code to race on a live leaderboard'],['What is Coin Rush?','A solo arcade mode: answer fast, build combos, earn gold and use power-ups'],['Keyboard shortcuts?','Press ? anywhere to see every shortcut'],['How do I star cards?','Tap the star on a flashcard, then study starred only from the study options'],['Dark mode?','Settings → Appearance → Dark, or follow system theme'],['Import a word list?','In the editor tap Import and paste lines like "term - definition"'],['How does Learn work?','Adaptive rounds: cards you miss keep coming back until mastered'],['Back up my data?','Settings → Data → Export backup as a .json file'],['Shortest way to share?','Share → Create short link gives a tiny link stored in the cloud']]);
  S.sets.reverse();persist()}

/* ================= auth ================= */
function initAuth(){onAuthStateChanged(auth,async u=>{
  S.user=u;renderTopbar();
  if(u){toast('Signed in as '+(u.displayName||u.email));await syncFromFs(u)}
})}
function auErr(e){const m={'auth/invalid-email':'That email looks invalid.','auth/user-not-found':'No account with that email.','auth/wrong-password':'Wrong password.','auth/invalid-credential':'Wrong email or password.','auth/email-already-in-use':'That email already has an account — sign in instead.','auth/weak-password':'Password needs at least 6 characters.','auth/popup-closed-by-user':'Google sign-in was cancelled.','auth/popup-blocked':'Popup blocked — allow popups and retry.','auth/network-request-failed':'Network error — check your connection.'};
  const el=$('#au-err');if(el)el.textContent=m[e.code]||e.message||'Something went wrong.'}
ACTIONS['au-google']=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider());closeModal()}catch(e){auErr(e)}};
ACTIONS['au-mode']=()=>{ST.auMode=ST.auMode==='in'?'up':'in';openAuth()};
ACTIONS['au-forgot']=async()=>{const em=$('#au-email').value.trim();if(!em)return toast('Type your email first','err');
  try{await sendPasswordResetEmail(auth,em);toast('Reset email sent!')}catch(e){auErr(e)}};
ACTIONS['au-submit']=async()=>{const em=$('#au-email').value.trim(),pw=$('#au-pass').value;
  if(!em||!pw)return auErr({code:'auth/invalid-email',message:'Fill in email and password.'});
  try{if(ST.auMode==='up'){const c=await createUserWithEmailAndPassword(auth,em,pw);
      await updateProfile(c.user,{displayName:em.split('@')[0]})}
    else await signInWithEmailAndPassword(auth,em,pw);
    closeModal()}catch(e){auErr(e)}};

function bindGlobal(){
  document.addEventListener('click',e=>{
    if(!e.target.closest('.menu')&&!e.target.closest('[data-a="set-menu"]'))closeMenus();
    const el=e.target.closest('[data-a]');
    if(!el){if(e.target.id==='modal-bg')closeModal();return}
    const fn=ACTIONS[el.dataset.a];if(fn){e.preventDefault();fn(el,e)}});
  document.addEventListener('input',e=>{const a=e.target.dataset.a;if(a&&A_IN[a])A_IN[a](e.target)});
  document.addEventListener('change',e=>{const a=e.target.dataset.a;if(a&&A_IN[a])A_IN[a](e.target)});
  document.addEventListener('keydown',e=>{
    const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable;
    if(e.key==='Escape'){if($('#modal-bg').classList.contains('on'))closeModal();closeMenus();return}
    if(typing)return;
    if(e.key==='?'&&S.settings.shortcuts){openShortcuts();return}
    if(e.key==='/'&&S.view==='home'){e.preventDefault();const q=$('#q');if(q)q.focus();return}
    if(!typing&&KEYS[S.view]&&$('#modal-bg').classList.contains('on')===false)KEYS[S.view](e)});
  window.addEventListener('online',()=>{S.online=true;toast('Back online ☁️');if(S.user)syncFromFs(S.user)});
  window.addEventListener('offline',()=>{S.online=false;toast('Offline — changes save on this device','err')})}

/* hash entry: #s=CODE shared set · #j=CODE join game · #d=… compressed link */
async function handleHash(){const h=location.hash.replace(/^#/,'');if(!h)return;
  const p=new URLSearchParams(h);
  try{
    if(p.get('s'))await importShared(p.get('s'));
    else if(p.get('j')){ST.joinCode=p.get('j').toUpperCase();ACTIONS['open-live-modal']()}
    else if(p.get('d')||p.get('c')){const raw=p.get('d')?await inflateB64(p.get('d')):b64uBack(p.get('c'));
      if(raw){addSet(unpackSet(raw));toast('Set imported from link! 🎉')}}
  }catch(e){toast('Could not read that link','err')}
  history.replaceState(null,'',location.pathname+location.search)}
async function importShared(code){toast('Fetching set…');
  try{const snap=await getDoc(doc(db,'shared',code));
    if(!snap.exists())return toast('That link expired or was deleted','err');
    const d=snap.data();const s={id:uid(),title:d.t,desc:'Shared via Cardly',emoji:d.e||'🔗',createdAt:Date.now(),updatedAt:Date.now(),dirty:true,ownerName:d.o||'',
      cards:(d.c||[]).map(p=>({id:uid(),t:p[0],d:p[1],m:0,s:false}))};
    if(!s.cards.length)return toast('That set is empty','err');
    addSet(s);toast('Imported "'+trunc(s.title,28)+'" 🎉');go('home')}catch(e){toast('Cloud link failed — ask for a JSON export','err')}}

/* ================= import modal ================= */
function parseBulk(text){const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const tabs=lines.filter(l=>l.includes('\t')).length;
  const dash=lines.filter(l=>/\s+[-–—]\s+/.test(l)).length;
  const comma=lines.filter(l=>l.includes(',')).length;
  const sep=tabs>=dash&&tabs>=comma&&tabs>0?'\t':dash>0?'dash':comma>0?',':null;
  if(!sep)return lines.map(l=>[l,'']);
  return lines.map(l=>{if(sep==='\t'){const p=l.split('\t');return [p[0].trim(),p.slice(1).join(' ').trim()]}
    const m=l.split(/\s+[-–—]\s+/);if(sep==='dash'&&m.length>=2)return [m[0].trim(),m.slice(1).join(' - ').trim()];
    const c=l.split(',');return [c[0].trim(),c.slice(1).join(',').trim()]})}
ACTIONS['open-import']=()=>openModal(`<div class="modal-head"><h2>⬆ Import</h2><button class="x" data-a="modal-x">✕</button></div>
  <label class="lbl">1 · Paste a link or JSON</label>
  <div class="row"><input id="imp-link" class="inp" placeholder="https://…#s=CODE or {json}">

  <hr class="hr">

  <textarea id="imp-bulk" class="ta" rows="6" placeholder="Hola&#10;Hello"></textarea>
  <label class="row mt" style="gap:8px;font-weight:600;font-size:.9rem;cursor:pointer"><span class="sw"><input type="checkbox" id="imp-swap"><i></i></span> Swap columns (definition first)</label>
  <button class="btn primary wfull mt" data-a="imp-bulk-go">Import as new set</button>
  <hr class="hr">
  <label class="lbl">3 · Or open a backup / exported file</label>
  <input type="file" id="imp-file" accept=".json" data-a="imp-file" style="font:inherit">`);
ACTIONS['imp-link']=async()=>{const v=$('#imp-link').value.trim();if(!v)return;
  try{
    const hm=v.match(/#s=([A-Z0-9]+)/i);
    if(hm){closeModal();await importShared(hm[1].toUpperCase());return}
    const dm=v.match(/#d=([\w-]+)/),cm=v.match(/#c=([\w-]+)/);
    if(dm||cm){const raw=dm?await inflateB64(dm[1]):b64uBack(cm[1]);
      if(raw){addSet(unpackSet(raw));closeModal();toast('Imported from link! 🎉');go('home');return}}
    const j=JSON.parse(v);
    importJson(j);closeModal();
  }catch(e){toast('Could not parse that link/JSON','err')}};
ACTIONS['imp-bulk-go']=()=>{let pairs=parseBulk($('#imp-bulk').value);
  if(!pairs.length||!pairs.some(p=>p[0]))return toast('Nothing to import — check the format','err');
  if($('#imp-swap').checked)pairs=pairs.map(p=>[p[1],p[0]]);
  const s=addSet({id:uid(),title:'Imported set '+new Date().toLocaleDateString(),desc:'Pasted import',emoji:'📥',createdAt:Date.now(),updatedAt:Date.now(),dirty:true,ownerName:S.user?S.user.displayName:'',
    cards:pairs.filter(p=>p[0]).map(p=>newCard(p[0],p[1]))});
  closeModal();toast(s.cards.length+' cards imported 🎉');go('home')};
A_IN['imp-file']=el=>{const f=el.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{importJson(JSON.parse(r.result));closeModal()}catch(e){toast('Invalid JSON file','err')}};r.readAsText(f)};
function importJson(j){
  if(Array.isArray(j.sets)){let n=0;for(const s of j.sets){if(!s.cards||!s.cards.length)continue;
    addSet({id:uid(),title:s.title||'Imported set',desc:s.desc||'',emoji:s.emoji||'📥',createdAt:Date.now(),updatedAt:Date.now(),dirty:true,ownerName:'',
      cards:s.cards.map(c=>newCard(Array.isArray(c)?c[0]:c.t,Array.isArray(c)?c[1]:c.d))});n++}
    toast(n+' sets restored 🎉');go('home');return}
  const cards=j.cards||j.terms&&j.terms.map(p=>({t:p.term,d:p.definition}));
  if(!cards||!cards.length)return toast('No cards found in that file','err');
  addSet({id:uid(),title:j.title||'Imported set',desc:j.desc||'',emoji:j.emoji||'📥',createdAt:Date.now(),updatedAt:Date.now(),dirty:true,ownerName:'',
    cards:cards.map(c=>newCard(Array.isArray(c)?c[0]:c.t,Array.isArray(c)?c[1]:c.d))});
  toast('Set imported 🎉');go('home')}

A_IN['backup-import']=el=>{const f=el.files[0];if(!f)return;const r=new FileReader();

  if(!q.length){lnComplete();return}
  L.cur=q[0];L.phase='q';L.type=(L.cur.m||0)>=2?'written':'mc';L.input='';
  $('#app').innerHTML=VIEWS.learn();
  const inp=$('#ln-in');if(inp)inp.focus()}
function lnComplete(){const L=ST.ln;L.done=true;saveResult({setId:L.setId,mode:'learn',score:L.stats.r,total:L.stats.r+L.stats.w,timeMs:Date.now()-L.t0});
  sfx('win');confetti();$('#app').innerHTML=VIEWS.learn()}
function lnAnswer(val){const L=ST.ln,c=L.cur;const dirTd=ST.studyOpts.dir==='td';
  const target=L.type==='mc'?c.opts[L.opts].a:(dirTd?c.d:c.t);
  const ok=L.type==='mc'?(val===L.opts):ansOk(val,target);
  L.stats[ok?'r':'w']++;

  else{c.m=Math.max(0,(c.m||0)-1);L.queue.push(L.queue.shift());sfx('bad')}

function makeQ(c,cards,ty,dirTd){const prompt=dirTd?c.t:c.d,answer=dirTd?c.d:c.t;
  if(ty==='mc'){const other=cards.filter(x=>x.id!==c.id&&norm(dirTd?x.d:x.t)!==norm(answer));
    const opts=shuffle([{t:answer,ok:true},...sample(other,3).map(x=>({t:dirTd?x.d:x.t,ok:false}))]);
    return {ty,q:prompt,opts:opts.map(o=>o.t),c:opts.findIndex(o=>o.ok),cid:c.id}}
  if(ty==='tf'){const lie=sample(cards.filter(x=>x.id!==c.id&&norm(dirTd?x.d:x.t)!==norm(answer)),1)[0];
    const truthy=!lie||Math.random()<.5;
    const shown=truthy?answer:(lie?dirTd?lie.d:lie.t:answer);
    return {ty,q:`"${prompt}" means "${shown}"`,tf:true,a:truthy,cid:c.id}}
  return {ty:'wr',q:prompt,a:answer,cid:c.id}}
function genTest(cards,o){const types=[];if(o.mc)types.push('mc');if(o.tf)types.push('tf');if(o.wr)types.push('wr');
  const use=types.length?types:['mc'];
  const qs=shuffle(cards).map(c=>makeQ(c,cards,use[Math.floor(Math.random()*use.length)],o.dirTd));
  return o.count&&o.count!=='all'?qs.slice(0,+o.count):qs}

  go('test');if(o.timer)T.every(1000,tsTick)}

    <div class="row mt" style="gap:10px">
      <button class="pu" data-a="ar-fifty" ${A.pu.fifty>0&&!A.lock?'':'disabled'}>✂️ 50/50 (${A.pu.fifty})</button>

ACTIONS['ar-answer']=el=>arAnswer(+el.dataset.i);
function arAnswer(i){const A=ST.ar;if(!A||A.lock||A.over)return;const q=A.qs[A.i];
  A.lock=true;A.picked=i;A.seen++;
  const ok=i===q.c;
  if(ok){A.combo++;A.maxCombo=Math.max(A.maxCombo,A.combo);A.right++;
    const mult=Math.min(A.combo,5);
    A.gold+=(50+10*(mult-1))*(q.gold?3:1);sfx('coin');
    if(A.combo%4===0){const k=Math.random()<.5?'fifty':'freeze';
      if(A.pu[k]<3){A.pu[k]++;toast(k==='fifty'?'✂️ 50/50 earned!':'❄️ Freeze earned!')}}}
  else{A.combo=0;A.lives--;sfx('bad')}
  arShow();
  T.after(ok?600:950,()=>{
    if(A.lives<=0)return arEnd('lives');
    if(A.i>=A.qs.length-1)return arEnd('deck');
    A.i++;A.gone=[];A.lock=false;arShow()})}
ACTIONS['ar-fifty']=()=>{const A=ST.ar,q=A.qs[A.i];if(A.pu.fifty<=0||A.lock)return;A.pu.fifty--;
  A.gone=shuffle(q.opts.map((_,i)=>i).filter(i=>i!==q.c)).slice(0,2);sfx('pop');arShow()};
ACTIONS['ar-freeze']=()=>{const A=ST.ar;if(A.pu.freeze<=0||A.lock)return;A.pu.freeze--;A.frozen=8;sfx('pop');arShow()};
function arEnd(reason){const A=ST.ar;if(!A||A.over)return;A.over=true;
  A.best=bestArc(A.setId);A.record=A.gold>A.best;
  saveResult({setId:A.setId,mode:'arcade',score:A.gold,total:A.seen,timeMs:Date.now()-A.t0});
  sfx('win');if(A.record)confetti();arShow()}

KEYS.arcade=e=>{const A=ST.ar;if(!A||A.lock||A.over)return;if(/^[1-4]$/.test(e.key))arAnswer(+e.key-1)};

/* ================= LIVE games (Blooket-style) ================= */
const Q_DUR=20000;
function buildLiveQs(cards,n=12){const pool=shuffle(cards.filter(c=>norm(c.t)&&norm(c.d))).slice(0,n);
  return pool.map(c=>{const others=cards.filter(x=>x.id!==c.id&&norm(x.d)!==norm(c.d));
    const opts=shuffle([{t:c.d,ok:true},...sample(others,3).map(x=>({t:x.d,ok:false}))]);
    return {q:c.t,opts:opts.map(o=>o.t),c:opts.findIndex(o=>o.ok)}})}
async function hostLive(set){const qs=buildLiveQs(set.cards,Math.min(12,Math.max(3,set.cards.length)));
  if(qs.length<3)return toast('Need at least 3 cards with terms AND definitions','err');
  const code=genCode();
  ST.live={code,role:'host',setId:set.id,room:{code,status:'lobby',qs,setTitle:set.title,emoji:set.emoji},
    players:[],pid:uid(),unsubs:[],ans:null,sawQ:-1,off:0,reveal:false,saved:false};
  toast('Creating room '+code+'…');
  try{await setDoc(doc(db,'rooms',code),{code,host:S.user?S.user.uid:'guest',hostName:myName(),
    title:set.title,emoji:set.emoji||'📘',setId:set.id,status:'lobby',qs,qIndex:-1,qStart:0,createdAt:Date.now()})}
  catch(e){ST.live=null;return toast('Live games need Firestore — enable it in the Firebase console','err')}
  joinAsPlayer(code,myName());
  subRoom(code);subPlayers(code);
  go('live')}
async function joinRoom(code){const name=(localStorage.getItem('cardly.name')||'').trim();
  openModal(`<div class="modal-head"><h2>🎮 Join game</h2><button class="x" data-a="modal-x">✕</button></div>
  <p class="muted" style="margin-bottom:14px">Joining room <b style="letter-spacing:.15em">${esc(code)}</b></p>
  <label class="lbl">Your name</label>
  <input id="join-name" class="inp" placeholder="e.g. Alex" maxlength="18" value="${esc(name)}">
  <button class="btn primary lg wfull mt" data-a="lv-join-confirm" data-code="${esc(code)}">Let me in! 🚀</button>`);
  $('#join-name').focus()}
ACTIONS['lv-join-confirm']=async el=>{const name=($('#join-name').value||'').trim()||'Player';
  localStorage.setItem('cardly.name',name);
  el.disabled=true;el.textContent='Joining…';
  try{const rs=await getDoc(doc(db,'rooms',el.dataset.code));
    if(!rs.exists()){el.disabled=false;return toast('Room not found — check the code','err')}
    if(rs.data().status!=='lobby'){el.disabled=false;return toast('Game already started — ask to host another','err')}
    closeModal();enterRoom(el.dataset.code,name,'player')}
  catch(e){el.disabled=false;toast('Could not reach the room — is Firestore on?','err')}};
async function enterRoom(code,name,role){ST.live={code,role,setId:null,players:[],pid:uid(),unsubs:[],ans:null,sawQ:-1,off:0,reveal:false,saved:false,room:null};
  joinAsPlayer(code,name);subRoom(code);subPlayers(code);go('live')}
async function joinAsPlayer(code,name){const L=ST.live;if(!L)return;
  L.myRef=doc(db,'rooms',code,'players',L.pid);
  try{await setDoc(L.myRef,{name,score:0,streak:0,a:{},joinedAt:serverTimestamp()});
    const snap=await getDoc(L.myRef);
    const ja=snap.data()&&snap.data().joinedAt;
    if(ja&&ja.toMillis)L.off=ja.toMillis()-Date.now()}catch(e){console.warn(e)}}
function subRoom(code){const L=ST.live;const u=onSnapshot(doc(db,'rooms',code),s=>{
    const L=ST.live;if(!L)return;
    if(!s.exists()){toast('The host closed the game','err');leaveLive();go('home');return}
    L.room={id:s.id,...s.data()};
    if(L.room.qIndex!==L.sawQ){L.sawQ=L.room.qIndex;L.ans=null;L.reveal=false;L.picked=null}
    rerenderLive()},()=>{toast('Connection lost','err')});L.unsubs.push(u)}
function subPlayers(code){const L=ST.live;const u=onSnapshot(collection(db,'rooms',code,'players'),snap=>{
    const L=ST.live;if(!L)return;
    L.players=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.score-a.score);
    L.me=L.players.find(p=>p.id===L.pid)||L.me;
    const r=L.room;
    if(r&&r.status==='playing'&&r.qIndex>=0&&!L.reveal){const ac=$('#anscount');
      if(ac)ac.textContent=L.players.filter(p=>p.a&&p.a[r.qIndex]!==undefined).length+' / '+L.players.length+' locked in';
      else rerenderLive()}
    else rerenderLive()},()=>{});L.unsubs.push(u)}
function qRemaining(){const L=ST.live;if(!L||!L.room)return 0;return (L.room.qStart||0)+Q_DUR-(Date.now()+L.off)}
function rerenderLive(){if(S.view!=='live'||!ST.live)return;$('#app').innerHTML=VIEWS.live();
  if(MOUNT.live)MOUNT.live();
  document.body.classList.toggle('playing-live',true)}
VIEWS.live=()=>{const L=ST.live;

  if(!r)return `<div class="live-bg"></div><div class="wrap center"><div class="live-panel"><b>Connecting to room ${esc(L.code)}…</b></div></div>`;
  if(r.status==='lobby')return lvLobby(L,r);

function lvLobby(L,r){const joinUrl=location.href.split('#')[0]+'#j='+L.code;

    <button class="btn sm mt" style="background:rgba(255,255,255,.14);color:#fff;border-color:transparent" data-a="lv-leave">Leave</button>
  </div></div>`}
ACTIONS['lv-copy-link']=el=>copyText(el.dataset.url);
ACTIONS['lv-start']=()=>{const L=ST.live;if(!L)return;
  updateDoc(doc(db,'rooms',L.code),{status:'playing',qIndex:0,qStart:Date.now()+4000}).catch(e=>toast('Could not start — check Firestore','err'))};
ACTIONS['lv-leave']=()=>{leaveLive();go('home')};
ACTIONS['lv-quit']=()=>confirmBox('Leave the game?','Your progress in this round will be lost.','Leave',()=>{leaveLive();go('home')});
function lvGame(L,r){const inQ=r.qIndex>=0&&r.qIndex<r.qs.length;
  if(!inQ)return `<div class="live-bg"></div><div class="wrap center"><div class="live-panel"><b>Get ready…</b><p class="muted mt">Loading next question</p></div></div>`;
  const q=r.qs[r.qIndex];const rem=qRemaining();const reveal=L.reveal||rem<=0;
  const bar=`<div class="timerbar" style="background:rgba(255,255,255,.15)"><i id="qbar" style="width:${Math.max(0,100*rem/Q_DUR)}%;background:#ffcd1f"></i></div>`;
  if(reveal){const correct=`<div class="live-panel center" style="margin-top:14px"><b style="font-size:1.15rem">✅ ${esc(q.opts[q.c])}</b></div>`+lvBoard(L,r,false)+
    (L.role==='host'?`<div class="row mt" style="justify-content:center"><button class="btn white lg" data-a="lv-next">${r.qIndex>=r.qs.length-1?'Finish 🏁':'Next question →'}</button></div>`:'');

    <div class="row between" style="color:#fff"><b>Q${r.qIndex+1}/${r.qs.length}</b><span class="chip" style="background:rgba(255,255,255,.16);color:#fff">⏱ 0s</span></div>${correct}</div>`}
  const answered=L.ans!==null;
  return `<div class="live-bg"></div><div class="wrap" style="max-width:760px">
  <div class="row between" style="color:#fff"><b>Q${r.qIndex+1}/${r.qs.length}</b>
    <span class="chip" style="background:rgba(255,255,255,.16);color:#fff" id="anscount">${L.players.filter(p=>p.a&&p.a[r.qIndex]!==undefined).length} / ${L.players.length} locked in</span></div>
  ${bar}
  ${answered?`<div class="live-panel center mt"><b style="font-size:1.3rem">🔒 Locked in!</b><p class="muted mt">Hold tight — revealing in a moment…</p></div>`
   :`<div class="live-panel" style="background:rgba(255,255,255,.04)"><div class="quiz-q" style="color:#fff">${esc(q.q)}</div>
    <div class="ans-grid">${q.opts.map((o,i)=>`<button class="ans-btn a${i}" data-a="lv-answer" data-i="${i}"><span class="ans-key">${'△○✕□'[i]}</span>${esc(o)}</button>`).join('')}</div></div>`}
  <div class="row between mt" style="color:#fff"><span>🔥 streak ${L.me?L.me.streak||0:0}</span><span>⭐ ${(L.me&&L.me.score)||0}</span>
  <button class="btn sm ghost" style="color:#fff" data-a="lv-quit">Quit</button></div></div>`}
function lvBoard(L,r,full){const top=full?L.players:L.players.slice(0,5);

    ${!full&&L.players.length>5&&L.me&&L.players.indexOf(L.me)>4?`<div class="lb-row me"><span class="lb-rank">${L.players.indexOf(L.me)+1}</span><span>${esc(L.me.name)}</span><span class="lb-score">${L.me.score||0}</span></div>`:''}</div>`}
ACTIONS['lv-answer']=async el=>{const L=ST.live,r=L.room;if(!r||L.ans!==null)return;
  const q=r.qs[r.qIndex];const i=+el.dataset.i;const ok=i===q.c;
  const rem=Math.max(0,qRemaining());const speed=Math.round(100*rem/Q_DUR);
  const gain=ok?100+speed+Math.min((L.me?L.me.streak||0:0)*10,60):0;
  L.ans={k:i,c:ok,s:gain};L.picked=i;

  try{await updateDoc(L.myRef,{['a.'+r.qIndex]:{k:i,c:ok,s:gain},score:((L.me&&L.me.score)||0)+gain,streak:ok?((L.me&&L.me.streak)||0)+1:0})}

  <div class="podium">${[1,0,2].map(ix=>{const p=top[ix];if(!p)return '<div></div>';
    return `<div class="pod b${ix+1}"><div class="em">${['🥇','🥈','🥉'][ix]}</div><b>${esc(p.name)}</b><div>${p.score||0}</div></div>`}).join('')}</div>
  ${lvBoard(L,r,true)}
  <p class="muted mt">${L.me?'You scored '+(L.me.score||0)+' points':'Thanks for playing!'}</p>
  <div class="row mt" style="justify-content:center">
    ${L.role==='host'?`<button class="btn white" data-a="lv-again">↻ Play again</button>`:''}
    <button class="btn" style="background:rgba(255,255,255,.14);color:#fff;border-color:transparent" data-a="lv-leave">Done</button></div>
  </div></div>`}
ACTIONS['lv-again']=async()=>{const L=ST.live,r=L.room;if(!r)return;
  const set=byId(r.setId);leaveLive();if(set)hostLive(set);else{toast('Original set no longer exists','err');go('home')}};
function leaveLive(){const L=ST.live;if(!L)return;
  L.unsubs.forEach(u=>{try{u()}catch(e){}});
  if(L.raf)cancelAnimationFrame(L.raf);
  try{if(L.role==='host')deleteDoc(doc(db,'rooms',L.code));
    else if(L.myRef)deleteDoc(L.myRef)}catch(e){}
  ST.live=null;document.body.classList.remove('playing-live')}
MOUNT.live=()=>{const L=ST.live;if(!L)return;
  const step=()=>{const L=ST.live;if(!L)return;const el=$('#qbar');
    if(el){const rem=qRemaining();el.style.width=Math.max(0,100*rem/Q_DUR)+'%';
      if(rem<=0&&!L.reveal){L.reveal=true;rerenderLive();return}}
    L.raf=requestAnimationFrame(step)};
  L.raf=requestAnimationFrame(step)};

/* ================= stats ================= */
VIEWS.stats=()=>{const R=S.results;
  const answered=R.reduce((a,r)=>a+(r.total||0),0),correct=R.reduce((a,r)=>a+(r.score||0),0);
  const acc=answered?Math.round(100*correct/answered):0;
  const mins=Math.round(R.reduce((a,r)=>a+(r.timeMs||0),0)/60000);
  const streak=calcStreak();
  const days=[...Array(14)].map((_,ix)=>{const d=new Date();d.setDate(d.getDate()-(13-ix));
    const key=d.toDateString();const day=R.filter(r=>new Date(r.at).toDateString()===key);
    return {d,n:day.length,q:day.reduce((a,r)=>a+(r.total||0),0)}});
  const maxq=Math.max(...days.map(d=>d.q),1);
  const bw=100/14;
  const chart=`<svg class="chart" viewBox="0 0 100 100" preserveAspectRatio="none">
    ${days.map((d,i)=>{const h=d.q/maxq*80+2;return `<rect x="${i*bw+bw*.18}" y="${100-h}" width="${bw*.64}" height="${h}" rx="1" fill="${d.q?'var(--accent)':'var(--card-2)'}"><title>${d.d.toLocaleDateString()}: ${d.q} answered</title></rect>`}).join('')}</svg>
  <div class="row between muted" style="font-size:.75rem"><span>${days[0].d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span><span>last 14 days</span><span>Today</span></div>`;
  const recent=[...R].reverse().slice(0,12);
  const modeNames={flash:'Flashcards',learn:'Learn',test:'Test',match:'Match',spell:'Spell',arcade:'Coin Rush',live:'Live game'};
  return `<div class="wrap">
  <div class="study-head"><button class="btn icon ghost" data-a="nav-home">←</button><h2>📊 Your stats</h2></div>
  <div class="statgrid">
    <div class="statcard"><b>${S.sets.length}</b><span>Sets</span></div>
    <div class="statcard"><b>${S.sets.reduce((a,s)=>a+s.cards.length,0)}</b><span>Cards</span></div>
    <div class="statcard"><b>${answered}</b><span>Questions answered</span></div>
    <div class="statcard"><b>${acc}%</b><span>Overall accuracy</span></div>
    <div class="statcard"><b>🔥 ${streak}</b><span>Day streak</span></div>
    <div class="statcard"><b>${mins}m</b><span>Time studied</span></div>
  </div>
  <div class="panel pad">${chart}</div>
  <div class="panel pad mt">
    <b>Recent sessions</b>
    ${recent.length?recent.map(r=>{const s=byId(r.setId);
      const line=r.mode==='match'?fmtTime(r.score):r.mode==='arcade'?r.score+' gold':r.score+'/'+r.total;
      return `<div class="sessrow"><span class="modebadge">${modeNames[r.mode]||r.mode}</span>
      <span style="font-weight:700;flex:1">${esc(s?s.title:'(deleted set)')}</span>
      <span>${line}</span><span class="muted" style="font-size:.82rem">${fmtAgo(r.at)}</span></div>`}).join('')
    :'<p class="muted mt">Study something and your history appears here.</p>'}
  </div></div>`};

/* ================= settings ================= */
ACTIONS['open-settings']=()=>{const st=S.settings;
  const sw=(id,k,label)=>`<label class="row between" style="padding:9px 0;cursor:pointer"><span style="font-weight:600">${label}</span>
    <span class="sw"><input type="checkbox" data-a="st-chk" data-k="${k}" ${st[k]?'checked':''}><i></i></span></label>`;
  const seg=(k,opts)=>`<div class="seg">${opts.map(([v,lab])=>`<button class="${st[k]===v?'on':''}" data-a="st-seg" data-k="${k}" data-v="${v}">${lab}</button>`).join('')}</div>`;
  openModal(`<div class="modal-head"><h2>⚙️ Settings</h2><button class="x" data-a="modal-x">✕</button></div>
  <label class="lbl">Appearance</label>
  <div class="row" style="flex-wrap:wrap;gap:12px">
    ${seg('theme',[['light','☀️ Light'],['dark','🌙 Dark'],['system','🖥 System']])}
    <span style="flex:1"></span>
    <span class="row" style="gap:6px">${Object.keys(ACCENTS).map(c=>`<span class="dot ${st.accent===c?'on':''}" style="background:${c}" data-a="st-accent" data-v="${c}"></span>`).join('')}</span>
  </div>
  <div class="row mt" style="gap:12px"><span class="muted" style="font-weight:600;font-size:.9rem">Text size</span>${seg('font',[['s','S'],['m','M'],['l','L']])}</div>
  ${sw('x','motion','✨ Animations')}
  ${sw('x','sound','🔊 Sound effects')}
  <hr class="hr"><label class="lbl">Study</label>
  ${sw('x','autospeak','🗣 Auto-pronounce flashcards')}
  ${sw('x','feedback','⚡ Instant feedback in tests')}
  ${sw('x','shortcuts','⌨️ Keyboard shortcuts')}
  <div class="row between" style="padding:9px 0"><span style="font-weight:600">Default direction</span>
    ${seg('dir',[['td','Term → Def'],['dt','Def → Term']])}</div>
  <div class="row between" style="padding:9px 0"><span style="font-weight:600">Match tiles</span>
    ${seg('matchPairs',[[4,'4'],[6,'6'],[8,'8'],[12,'12']])}</div>
  <hr class="hr"><label class="lbl">Data</label>
  <div class="row" style="flex-wrap:wrap">
    <button class="btn sm" data-a="backup-export">⬇ Export backup</button>
    <label class="btn sm" style="cursor:pointer">⬆ Restore backup<input type="file" accept=".json" data-a="backup-import" hidden></label>
    <button class="btn sm danger" data-a="clear-data">🗑 Clear local data</button>
  </div>
  <p class="muted mt" style="font-size:.8rem">${S.user?'☁️ Signed in — everything syncs automatically.':'👀 Guest mode — data lives in this browser only. Sign in to sync.'}</p>`)};
ACTIONS['st-seg']=el=>{const k=el.dataset.k;let v=el.dataset.v;
  if(k==='matchPairs')v=+v;S.settings[k]=v;saveSettings();applySettings();
  el.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on'));el.classList.add('on')};
ACTIONS['st-accent']=el=>{S.settings.accent=el.dataset.v;saveSettings();applySettings();
  $$('.dot').forEach(d=>d.classList.remove('on'));el.classList.add('on')};
A_IN['st-chk']=el=>{S.settings[el.dataset.k]=el.checked;saveSettings();applySettings()};

/* ================= boot ================= */
async function boot(){loadLocal();applySettings();seedSets();renderTopbar();go('home');bindGlobal();await handleHash();initAuth()}
boot();
</script>
</body>
</html>
